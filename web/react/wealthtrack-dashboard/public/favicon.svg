<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" aria-hidden="true">
  <rect width="32" height="32" rx="8" fill="#1D4ED8"/>
  <!-- ascending track -->
  <path
    d="M7 21.5 L12.5 16 L16.5 19 L25 10.5"
    stroke="#fff"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
