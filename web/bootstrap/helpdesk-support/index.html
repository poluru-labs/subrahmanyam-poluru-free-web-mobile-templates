<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#2563EB">
        <meta name="description" content="Helpdesk Support — a connected demo workspace for thoughtful customer support.">
        <title>Overview · Helpdesk Support</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%232563eb'/%3E%3Ctext x='9' y='29' fill='white' font-size='28'%3Eh%3C/text%3E%3C/svg%3E">
    </head>
    <body class="hlp-dsk-app">
        <a class="hlp-dsk-skip" href="#main">Skip to content</a>
        <aside id="sidebar" class="hlp-dsk-sidebar"></aside>
        <div class="hlp-dsk-shell">
            <header class="hlp-dsk-topbar">
                <div class="d-flex align-items-center gap-3">
                    <button
                        class="hlp-dsk-icon-btn"
                        data-action="sidebar"
                        aria-label="Toggle sidebar"
                        aria-expanded="true"
                    >
                        <i class="bi bi-layout-sidebar"></i>
                    </button>
                    <span id="breadcrumb">Workspace
                        <i class="bi bi-chevron-right mx-2"></i>
                        <strong>Overview</strong>
                    </span>
                </div>
                <div class="hlp-dsk-top-actions">
                    <label class="hlp-dsk-search">
                        <i class="bi bi-search"></i>
                        <input id="global-search" placeholder="Search anything..." aria-label="Search tickets">
                        <kbd>⌘ K</kbd>
                    </label>
                    <button class="hlp-dsk-icon-btn hlp-dsk-notification" data-action="notifications" aria-label="Notifications">
                        <i class="bi bi-bell"></i>
                        <span></span>
                    </button>
                    <div class="hlp-dsk-divider"></div>
                    <button class="hlp-dsk-profile" data-action="profile" aria-label="Open profile menu">
                        <span class="hlp-dsk-avatar hlp-dsk-avatar-blue">SP</span>
                        <i class="bi bi-chevron-down"></i>
                    </button>
                </div>
            </header>
            <main id="main" class="hlp-dsk-main" tabindex="-1">
                <div class="hlp-dsk-empty" role="status">Loading your workspace…</div>
            </main>
            <footer class="hlp-dsk-footer">
                <span>
                    <span class="hlp-dsk-dot"></span> All systems operational</span>
                <span>Made for better conversations.
                    <span class="mx-2">·</span> Helpdesk Support</span>
            </footer>
        </div>
        <dialog id="modal" class="hlp-dsk-dialog" aria-labelledby="modal-title"></dialog>
        <div
            id="toast"
            class="hlp-dsk-toast"
            role="status"
            aria-live="polite"
        ></div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
        <script src="assets/js/script.js"></script>
    </body>
</html>
