<section class="intro"><h2>Deck studio</h2><p>Deck status, theme tokens, slide counts, and share links.</p></section><div class="period" role="group" aria-label="Time period"><button type="button" class="period-btn active">7d</button><button type="button" class="period-btn">30d</button></div><div class="stats">@for (s of stats; track s.label) {<article class="card stat"><p class="label">{{ s.label }}</p><p class="value">{{ s.value }}</p><p class="trend" [class.up]="s.up">{{ s.trend }}</p></article>}</div><article class="card"><svg class="chart" viewBox="0 0 400 100" role="img" aria-label="Trend"><path fill="none" stroke="#E11D48" stroke-width="3" d="M0 72 80 65 160 58 240 42 320 35 400 28"/></svg></article>
