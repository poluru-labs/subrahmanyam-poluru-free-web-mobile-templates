<section class="intro"><h2>Send performance</h2><p>Draft readiness, delivery, opens, and bounces.</p></section>
<div class="period" role="group" aria-label="Time period"><button type="button" class="period-btn active">7d</button><button type="button" class="period-btn">30d</button></div>
<div class="stats">@for (s of stats; track s.label) {<article class="card stat"><p class="label">{{ s.label }}</p><p class="value">{{ s.value }}</p><p class="trend" [class.up]="s.up">{{ s.trend }}</p></article>}</div>
<article class="card chart-card"><header><h3>Trend</h3></header><svg class="chart" viewBox="0 0 400 100" role="img" aria-label="Trend"><path fill="none" stroke="#1E40AF" stroke-width="3" d="M0 72 80 65 160 58 240 42 320 35 400 28"/></svg></article>
