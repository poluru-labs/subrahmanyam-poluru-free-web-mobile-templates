<section class="intro"><h2>Courses</h2><p>Sample queue for demonstration only.</p></section>
<article class="card"><table>
  <thead><tr><th scope="col">Course</th><th scope="col">Stage</th><th scope="col">Owner</th><th scope="col">Modules</th></tr></thead>
  <tbody>
    @for (row of rows; track $index) {
      <tr><td>{{ row.course }}</td><td>{{ row.stage }}</td><td>{{ row.owner }}</td><td>{{ row.modules }}</td></tr>
    }
  </tbody>
</table></article>
