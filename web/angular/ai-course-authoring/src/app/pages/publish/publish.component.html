<section class="intro"><h2>Publish</h2><p>Sample queue for demonstration only.</p></section>
<article class="card"><table>
  <thead><tr><th scope="col">Course</th><th scope="col">Launch date</th><th scope="col">Owner</th><th scope="col">Status</th></tr></thead>
  <tbody>
    @for (row of rows; track $index) {
      <tr><td>{{ row.course }}</td><td>{{ row.launchDate }}</td><td>{{ row.owner }}</td><td>{{ row.status }}</td></tr>
    }
  </tbody>
</table></article>
