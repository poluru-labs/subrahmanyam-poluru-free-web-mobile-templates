<section class="intro">
  <h2>Guidelines</h2>
  <p>Published rules for logo, color, typography, and voice.</p>
</section>

<article class="card">
  <table>
    <thead>
      <tr>
        <th scope="col">Section</th>
        <th scope="col">Pages</th>
        <th scope="col">Updated</th>
        <th scope="col">Owner</th>
      </tr>
    </thead>
    <tbody>
      @for (s of sections; track s.title) {
        <tr>
          <td><strong>{{ s.title }}</strong></td>
          <td>{{ s.pages }}</td>
          <td>{{ s.updated }}</td>
          <td>{{ s.owner }}</td>
        </tr>
      }
    </tbody>
  </table>
</article>
