<div class="shell">
  <aside class="sidebar" aria-label="Sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">§</span>
      <div>
        <strong>{{ brand }}</strong>
        <small>{{ tagline }}</small>
      </div>
    </div>
    <nav class="sidebar-nav">
      @for (item of nav; track item.path) {
        <a
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
        >
          <span class="nav-icon" aria-hidden="true">
            @switch (item.icon) {
              @case ('home') {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9z"/></svg>
              }
              @default {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4h12v16H6zM9 8h6M9 12h6"/></svg>
              }
            }
          </span>
          {{ item.label }}
        </a>
      }
    </nav>
    <div class="profile">
      <span class="avatar" aria-hidden="true">{{ initials(leadName) }}</span>
      <div>
        <strong>{{ leadName }}</strong>
        <span>{{ leadRole }}</span>
      </div>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <div>
        <p class="eyebrow">{{ eyebrow }}</p>
        <h1>{{ heading() }}</h1>
      </div>
      <button type="button" class="btn">Request counsel</button>
    </header>
    <div class="content">
      <router-outlet />
      <p class="demo-note">Sample data for demonstration only.</p>
    </div>
    <footer class="site-footer">
      Created by
      <a href="https://polurus.com" target="_blank" rel="noopener noreferrer">Subrahmanyam Poluru</a>
    </footer>
  </div>
</div>
