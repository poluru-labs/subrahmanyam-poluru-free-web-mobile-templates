<section class="intro">
  <h2>Agreement desk</h2>
  <p>Queue health, playbook match, and counsel sign-off.</p>
</section>

<div class="period" role="group" aria-label="Time period">
  <button type="button" class="period-btn active">7d</button>
  <button type="button" class="period-btn">30d</button>
</div>

<div class="stats">
  @for (s of stats; track s.label) {
    <article class="card stat">
      <p class="label">{{ s.label }}</p>
      <p class="value">{{ s.value }}</p>
      <p class="trend" [class.up]="s.up">{{ s.trend }}</p>
    </article>
  }
</div>

<article class="card chart-card">
  <header><h3>Sign-off timeline</h3></header>
  <svg class="chart" viewBox="0 0 400 100" role="img" aria-label="Sign-off timeline">
    <path fill="none" stroke="#090088" stroke-width="3" d="M0 70 80 62 160 58 240 40 320 38 400 28" />
  </svg>
</article>
