<section class="intro"><h2>Reports</h2><p>Sample queue for demonstration only.</p></section>
<article class="card"><table>
  <thead><tr><th scope="col">Report</th><th scope="col">Schedule</th><th scope="col">Last run</th><th scope="col">Owner</th></tr></thead>
  <tbody>
    @for (row of rows; track $index) {
      <tr><td>{{ row.report }}</td><td>{{ row.schedule }}</td><td>{{ row.lastRun }}</td><td>{{ row.owner }}</td></tr>
    }
  </tbody>
</table></article>
