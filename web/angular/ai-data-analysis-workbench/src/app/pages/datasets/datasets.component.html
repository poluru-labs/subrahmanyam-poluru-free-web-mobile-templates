<section class="intro"><h2>Datasets</h2><p>Sample queue for demonstration only.</p></section>
<article class="card"><table>
  <thead><tr><th scope="col">Dataset</th><th scope="col">Source</th><th scope="col">Rows</th><th scope="col">Steward</th></tr></thead>
  <tbody>
    @for (row of rows; track $index) {
      <tr><td>{{ row.dataset }}</td><td>{{ row.source }}</td><td>{{ row.rows }}</td><td>{{ row.steward }}</td></tr>
    }
  </tbody>
</table></article>
